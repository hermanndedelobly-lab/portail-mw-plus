# Hébergement Netlify : le site est statique, aucune compilation n'est nécessaire.
[build]
  publish = "."

# Le contenu modifié depuis l'administration doit apparaître sans délai.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Application Android à télécharger
[[headers]]
  for = "/telecharger/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment"

# Morceaux de musique téléchargeables
[[headers]]
  for = "/assets/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
