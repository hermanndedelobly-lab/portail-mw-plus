<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MW+ · Portail culturel wê</title>
  <meta name="description" content="MW+ — La Culture Wê, notre fierté. Histoire, langue, traditions, musique, tourisme, médiathèque, actualités et annuaire du peuple wê de Côte d'Ivoire.">
  <meta name="theme-color" content="#17703a">
  <meta property="og:title" content="MW+ · Portail culturel wê">
  <meta property="og:description" content="La Culture Wê, notre fierté : histoire, langue, traditions, musique, villes et communauté du peuple wê de Côte d'Ivoire.">
  <meta property="og:image" content="https://mw-pluss.netlify.app/assets/logo-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:url" content="https://mw-pluss.netlify.app/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="MW+">
  <link rel="icon" type="image/png" href="assets/logo-96.png">
  <link rel="apple-touch-icon" href="assets/logo-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#accueil" aria-label="MW+, retour à l’accueil">
        <img src="assets/logo-96.png" alt="" width="52" height="52">
        <span class="brand__text"><strong>MW+</strong><small>La Culture Wê, notre fierté</small></span>
      </a>
      <nav id="nav" class="nav" aria-label="Menu principal"></nav>
      <div class="topbar__actions">
        <a class="icon-btn" href="#recherche" aria-label="Rechercher sur le site"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></a>
        <a class="icon-btn" id="btn-compte" href="#membres--compte" aria-label="Espace membres : se connecter"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></a>
        <a class="btn btn--brand btn--sm topbar__cta" href="#contact--proposer">Contribuer</a>
        <button class="menu-btn" aria-expanded="false" aria-controls="nav" type="button">
          <span class="menu-btn__bars" aria-hidden="true"></span><span class="menu-btn__label">Menu</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <a class="chat-fab" id="chat-fab" href="#membres--discussions" aria-label="Discuter avec la communauté">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19.1z"/></svg><span>Discuter</span>
  </a>

  <footer class="footer">
    <div class="wrap"><div class="contactbar" id="contactbar"></div></div>
    <div class="footer__inner">
      <div class="footer__brand">
        <img src="assets/logo-192.png" alt="Logo MW+" width="96" height="96" loading="lazy">
        <p><strong>MW+</strong><br>La Culture Wê, notre fierté.<br><span class="muted">Portail de valorisation et de transmission de la culture du peuple wê, ouest de la Côte d'Ivoire.</span></p>
      </div>
      <div class="footer__links" id="footer-links"></div>
    </div>
    <p class="footer__copy">© <span id="year"></span> MW+ · Contenus partagés par la communauté wê · <a href="admin/">Administration</a></p>
  </footer>

  <!-- Déclaration des formulaires pour Netlify Forms (les vrais formulaires sont affichés par app.js) -->
  <div hidden>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field"><input name="bot-field"><input name="nom"><input name="email"><input name="sujet"><textarea name="message"></textarea></form>
    <form name="partenaire" data-netlify="true" netlify-honeypot="bot-field"><input name="bot-field"><input name="structure"><input name="contact"><input name="email"><input name="telephone"><input name="partenariat"><input name="ville"><textarea name="projet"></textarea></form>
    <form name="contenu" data-netlify="true" netlify-honeypot="bot-field"><input name="bot-field"><input name="nom"><input name="contact"><input name="sujet"><input name="rubrique"><input name="village"><input name="source"><textarea name="contribution"></textarea><input name="accord"></form>
    <form name="activite" data-netlify="true" netlify-honeypot="bot-field"><input name="bot-field"><input name="nom"><input name="secteur"><input name="ville"><input name="quartier"><input name="adresse"><input name="telephone"><input name="responsable"><input name="email"><textarea name="description"></textarea><input name="type"><input name="accord"></form>
    <form name="proposition" data-netlify="true" netlify-honeypot="bot-field"><input name="bot-field"><input name="type"><input name="titre"><input name="auteur"></form>
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field"><input name="bot-field"><input name="email"></form>
  </div>

  <script src="app.js"></script>
  <script src="membres.js"></script>
</body>
</html>
