# Configuration de l'espace administrateur (Decap CMS).
# Si le dépôt GitHub porte un autre nom, modifiez « repo » ci-dessous.
# Pour tester sur un ordinateur : lancer « npx decap-server » à la racine du site, puis ouvrir /admin/
backend:
  name: github
  repo: hermanndedelobly-lab/portail-mw-plus
  branch: main
  commit_messages:
    create: 'Ajout : {{collection}} « {{slug}} »'
    update: 'Mise à jour : {{collection}} « {{slug}} »'
    delete: 'Suppression : {{collection}} « {{slug}} »'
    uploadMedia: Ajout du fichier {{path}}
    deleteMedia: Suppression du fichier {{path}}
local_backend: true
locale: fr
site_url: /
display_url: /
logo_url: ../assets/logo-192.png
media_folder: assets/uploads
public_folder: assets/uploads
collections:
- name: une
  label: À la une (carrousel)
  files:
  - label: Diapositives de l'accueil
    name: diapositives
    file: content/une.json
    fields:
    - label: Diapositives
      label_singular: diapositive
      name: diapositives
      widget: list
      summary: '{{fields.titre}}'
      fields:
      - label: Image
        name: image
        widget: image
      - label: Étiquette
        name: etiquette
        widget: string
        hint: 'Ex. : Traditions, Danses, Événement'
      - label: Titre
        name: titre
        widget: string
      - label: Texte
        name: texte
        widget: text
      - label: 'Lien (page du site, ex. #culture--danses)'
        name: lien
        widget: string
        required: false
      - label: Crédit photo
        name: credit
        widget: string
        required: false
- name: actualites
  label: Actualités
  files:
  - label: Actualités
    name: liste
    file: content/actualites.json
    fields:
    - label: Articles
      label_singular: article
      name: articles
      widget: list
      add_to_top: true
      summary: '{{fields.date}} · {{fields.titre}}'
      fields:
      - label: Date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD/MM/YYYY
        time_format: false
        picker_utc: true
      - label: Catégorie
        name: categorie
        widget: select
        options:
        - Culture
        - Communauté
        - Événement
        - Annonce
      - label: Titre
        name: titre
        widget: string
      - label: Résumé
        name: resume
        widget: text
      - label: Lieu
        name: lieu
        widget: string
        required: false
      - label: Image
        name: image
        widget: image
        required: false
      - label: 'Lien (facultatif, ex. #culture--danses ou https://…)'
        name: lien
        widget: string
        required: false
- name: dictionnaire
  label: Dictionnaire
  files:
  - label: Dictionnaire français-wê
    name: mots
    file: content/dictionnaire.json
    fields:
    - label: Mots
      label_singular: mot
      name: entrees
      widget: list
      summary: '{{fields.fr}} → {{fields.we}}'
      fields:
      - label: Français
        name: fr
        widget: string
      - label: Wê
        name: we
        widget: string
      - label: Catégorie
        name: categorie
        widget: string
        required: false
        hint: 'Ex. : Salutations, Famille, Nombres, Nature'
      - label: Variante (guéré, wobé, canton…)
        name: variante
        widget: string
        required: false
      - label: Exemple
        name: exemple
        widget: text
        required: false
- name: annuaire
  label: Annuaire Wê Business
  files:
  - label: Entreprises et professionnels
    name: entreprises
    file: content/annuaire.json
    fields:
    - label: Fiches
      label_singular: fiche
      name: entreprises
      widget: list
      summary: '{{fields.nom}} · {{fields.ville}}'
      fields:
      - label: Nom
        name: nom
        widget: string
      - label: Catégorie
        name: categorie
        widget: select
        options:
        - Commerce
        - Entrepreneur
        - Artisan
        - Service
      - label: Activité
        name: activite
        widget: string
      - label: Ville
        name: ville
        widget: string
      - label: Téléphone
        name: telephone
        widget: string
        required: false
      - label: Description
        name: description
        widget: text
        required: false
