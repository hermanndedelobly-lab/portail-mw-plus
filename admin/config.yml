# Configuration de l'espace administrateur (Decap CMS).
# Si le dépôt GitHub porte un autre nom, modifiez « repo » ci-dessous.
# Pour tester sur un ordinateur : lancer « npx decap-server » à la racine du site, puis ouvrir /admin/
backend:
  name: github
  repo: hermanndedelobly-lab/portail-mw-plus
  branch: main
  commit_messages:
    create: 'Ajout : {{collection}} « {{slug}} »'
    update: 'Mise à jour : {{collection}} « {{slug}} »'
    delete: 'Suppression : {{collection}} « {{slug}} »'
    uploadMedia: Ajout du fichier {{path}}
    deleteMedia: Suppression du fichier {{path}}
local_backend: true
locale: fr
site_url: /
display_url: /
logo_url: ../assets/logo-192.png
media_folder: assets/uploads
public_folder: assets/uploads
collections:
- name: une
  label: À la une (carrousel)
  files:
  - label: Diapositives de l'accueil
    name: diapositives
    file: content/une.json
    fields:
    - label: Diapositives
      label_singular: diapositive
      name: diapositives
      widget: list
      summary: '{{fields.titre}}'
      fields:
      - label: Image
        name: image
        widget: image
      - label: Étiquette
        name: etiquette
        widget: string
        hint: 'Ex. : Traditions, Danses, Événement'
      - label: Titre
        name: titre
        widget: string
      - label: Texte
        name: texte
        widget: text
      - label: 'Lien (page du site, ex. #culture--danses)'
        name: lien
        widget: string
        required: false
      - label: Crédit photo
        name: credit
        widget: string
        required: false
- name: actualites
  label: Actualités
  files:
  - label: Actualités
    name: liste
    file: content/actualites.json
    fields:
    - label: Articles
      label_singular: article
      name: articles
      widget: list
      add_to_top: true
      summary: '{{fields.date}} · {{fields.titre}}'
      fields:
      - label: Date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD/MM/YYYY
        time_format: false
        picker_utc: true
      - label: Catégorie
        name: categorie
        widget: select
        options:
        - Culture
        - Communauté
        - Événement
        - Annonce
      - label: Titre
        name: titre
        widget: string
      - label: Résumé
        name: resume
        widget: text
      - label: Lieu
        name: lieu
        widget: string
        required: false
      - label: Image
        name: image
        widget: image
        required: false
      - label: 'Lien (facultatif, ex. #culture--danses ou https://…)'
        name: lien
        widget: string
        required: false
- name: musique
  label: Musique (écoute et téléchargement)
  files:
  - label: Titres
    name: titres
    file: content/musique.json
    fields:
    - label: Titres
      label_singular: titre
      name: titres
      widget: list
      add_to_top: true
      summary: '{{fields.artiste}} · {{fields.titre}}'
      fields:
      - label: Titre du morceau
        name: titre
        widget: string
      - label: Artiste
        name: artiste
        widget: string
      - label: Album ou single
        name: album
        widget: string
        required: false
      - label: Année
        name: annee
        widget: string
        required: false
      - label: Genre
        name: genre
        widget: string
        required: false
        hint: 'Ex. : tradition, zouglou, gospel, tématé…'
      - label: Fichier audio (MP3)
        name: audio
        widget: file
        required: false
        media_folder: /assets/audio
        public_folder: assets/audio
      - label: Ou adresse du fichier audio (si hébergé ailleurs)
        name: audioUrl
        widget: string
        required: false
      - label: Lien YouTube
        name: youtube
        widget: string
        required: false
      - label: Pochette
        name: image
        widget: image
        required: false
      - label: Téléchargement autorisé par l’artiste
        name: telechargement
        widget: boolean
        default: false
        required: false
      - label: Paroles ou présentation
        name: texte
        widget: text
        required: false
- name: dictionnaire
  label: Dictionnaire
  files:
  - label: Dictionnaire français-wê
    name: mots
    file: content/dictionnaire.json
    fields:
    - label: Mots
      label_singular: mot
      name: entrees
      widget: list
      summary: '{{fields.fr}} → {{fields.we}}'
      fields:
      - label: Français
        name: fr
        widget: string
      - label: Wê
        name: we
        widget: string
      - label: Catégorie
        name: categorie
        widget: string
        required: false
        hint: 'Ex. : Salutations, Famille, Nombres, Nature'
      - label: Variante (guéré, wobé, canton…)
        name: variante
        widget: string
        required: false
      - label: Exemple
        name: exemple
        widget: text
        required: false
